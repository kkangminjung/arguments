class Opponent{
 constructor(canvas){this.canvas=canvas;this.pointer=0;this.emoteUntil=0;this.ended=false;this.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;this.gl=canvas.getContext('webgl',{alpha:true,antialias:true});if(this.gl)this.initGL();else this.ctx=canvas.getContext('2d');canvas.parentElement.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();this.pointer=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));});canvas.parentElement.addEventListener('pointerleave',()=>this.pointer=0);this.tick=this.tick.bind(this);requestAnimationFrame(this.tick);}
 initGL(){const gl=this.gl;const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,'attribute vec3 p;attribute float shade;uniform float aspect;varying float tone;void main(){tone=shade;gl_Position=vec4(p.x/(1.9*aspect),(p.y+.04)/1.9,-p.z/8.0,1.0);}'));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying float tone;void main(){gl_FragColor=vec4(vec3(tone),1.0);}'));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error('WebGL link failed');gl.useProgram(p);this.buffer=gl.createBuffer();this.shadeBuffer=gl.createBuffer();this.location=gl.getAttribLocation(p,'p');this.shadeLocation=gl.getAttribLocation(p,'shade');this.aspect=gl.getUniformLocation(p,'aspect');gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);}
 react(){this.emoteUntil=performance.now()+1200;}
 stop(){this.ended=true;}
 tick(ms){if(!this.canvas.isConnected||this.ended)return;if(this.lastFrame&&ms-this.lastFrame<32){requestAnimationFrame(this.tick);return;}this.lastFrame=ms;const t=ms/1000,angry=this.reduced?0:ms<this.emoteUntil?Math.min(1,(this.emoteUntil-ms)/350):0;const frame=frameGeometry(buildModel(angry,t),-.23+this.pointer*.3+(this.reduced?0:Math.sin(t*.65)*.055),this.reduced?0:Math.sin(t*.8)*.015,this.reduced?0:Math.sin(t*1.3)*.015);this.draw(frame);requestAnimationFrame(this.tick);}
 draw({fill,ink,shades}){const c=this.canvas,dpr=Math.min(2,devicePixelRatio||1),w=Math.round(c.clientWidth*dpr),h=Math.round(c.clientHeight*dpr);if(!w||!h)return;if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  if(this.gl){const gl=this.gl;gl.viewport(0,0,w,h);gl.clearColor(1,1,1,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(this.aspect,w/h);
   for(const[data,tones]of[[fill,shades],[ink,new Float32Array(ink.length/3)]]){gl.bindBuffer(gl.ARRAY_BUFFER,this.buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(this.location);gl.vertexAttribPointer(this.location,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,this.shadeBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(tones),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(this.shadeLocation);gl.vertexAttribPointer(this.shadeLocation,1,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,data.length/3);}
  }else if(this.ctx){const ctx=this.ctx;ctx.clearRect(0,0,w,h);const tris=[];for(const[data,isInk]of[[fill,false],[ink,true]])for(let i=0;i<data.length;i+=9){const gray=isInk?0:Math.round(255*shades[i/3]);tris.push({p:data.slice(i,i+9),z:(data[i+2]+data[i+5]+data[i+8])/3,gray});}tris.sort((a,b)=>a.z-b.z);for(const tri of tris){ctx.beginPath();for(let j=0;j<3;j++){const x=w/2+tri.p[j*3]*h/3.8,y=h/2-(tri.p[j*3+1]+.04)*h/3.8;j?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fillStyle=`rgb(${tri.gray},${tri.gray},${tri.gray})`;ctx.fill();}}
 }
}


const $=s=>document.querySelector(s);let state=null,opponent=null;
function show(id){for(const name of['start-screen','game-screen','result-screen'])$('#'+name).hidden=name!==id;}
function render(){const n=nodes[state.node];$('#opponent-line').textContent=n.line;$('#choice-explain').textContent=n.explain;$('#choice-correct').textContent=n.correct;$('#choice-exit').hidden=!canExit(state);$('#choice-exit').dataset.effect=exitEffectLevel(state);}
$('#start-button').onclick=()=>{show('game-screen');state=createGame(performance.now());render();try{opponent=new Opponent($('#opponent'));}catch(e){console.error('3D rendering failed',e);}$('#choice-explain').focus({preventScroll:true});};
function act(kind){if(!state||state.ended)return;state=choose(state,kind,performance.now());if(state.ended){opponent?.stop();$('#result-message').textContent=endingText(state);show('result-screen');$('#restart-button').focus({preventScroll:true});}else{render();opponent?.react();}}
$('#choice-explain').onclick=()=>act('explain');$('#choice-correct').onclick=()=>act('correct');$('#choice-exit').onclick=()=>act('exit');$('#restart-button').onclick=()=>location.reload();

})();
</script></body></html>
