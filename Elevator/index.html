<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181d22"><title>1층까지</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#181d22;color:#edf0f0;font-family:Arial,'Malgun Gothic',sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 0 max(8px,env(safe-area-inset-bottom))}.stage{position:relative;width:min(100vw,1024px,calc((100svh - 126px)*6/7));aspect-ratio:6/7}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:none}.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:43px 43px;gap:4px;touch-action:none}button{border:1px solid #65717a;border-bottom:3px solid #0c1116;border-radius:2px;background:#34404a;color:#eef2f0;font-size:21px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}button:active,button.pressed{background:#607581;transform:translateY(1px)}button:focus-visible{outline:2px solid #e6d996;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{position:absolute;left:78%;top:50%;display:flex;flex-direction:column;gap:5px;z-index:2}.actions[hidden]{display:none}.actions button{font-size:clamp(11px,1.8vw,15px);min-width:61px;padding:8px 10px;white-space:nowrap;background:#e0e4df;color:#28333b;border-color:#6b767d;border-bottom-color:#717b7f}.toast{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:4;background:#182027ed;border:1px solid #d3dada;padding:7px 10px;font-size:clamp(11px,1.8vw,15px);white-space:nowrap}.toast[hidden]{display:none}.ending{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:23px;background:#181d22f5;z-index:6;text-align:center}.ending[hidden]{display:none}.ending p{font-size:20px;line-height:1.7;margin:0}.ending button{padding:12px 24px;font-size:15px;touch-action:manipulation}@media(max-height:450px){body{gap:2px;padding:3px}.stage{width:min(78vw,calc((100svh - 12px)*6/7))}.dpad{position:fixed;right:6px;bottom:8px;grid-template-columns:37px 37px 37px;grid-template-rows:36px 36px;gap:2px}.actions button{padding:6px;font-size:11px;min-width:48px}}
.notice,.chat{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:4;white-space:nowrap;font-size:clamp(11px,1.6vw,15px)}.notice{left:50%;top:14%;background:#182027ed;color:#eef1ed;border:1px solid #c4cece;padding:7px 10px}.chat{background:#e7e9df;color:#344149;border:1px solid #6b7b83;border-radius:3px;padding:5px 8px;font-size:clamp(11px,1.5vw,14px)}.notice[hidden],.chat[hidden]{display:none}.ending #resultTime{font-size:16px}.actions button.lit{background:#e7c779;box-shadow:0 0 0 2px #d9b56680} .intro{position:fixed;inset:0;background:#181d22f7;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:25px;padding:25px;text-align:center}.intro[hidden],.dpad[hidden]{display:none}.intro p{font-size:clamp(17px,3.5vw,24px);line-height:1.8;margin:0}.intro button{font-size:16px;padding:13px 25px;touch-action:manipulation} </style></head><body>
<div class="stage"><canvas id="game" width="288" height="336" tabindex="0" aria-label="18층에서 1층까지 내려가는 엘리베이터. 화살표 또는 WASD로 이동합니다."></canvas><div id="actions" class="actions" hidden><button id="open" aria-label="문 열림">◀│▶ 열림</button><button id="close" aria-label="문 닫힘">▶│◀ 닫힘</button></div><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><div id="chat-d" class="chat" hidden></div><div id="chat-e" class="chat" hidden></div><div id="chat-f" class="chat" hidden></div><div id="toast" class="toast" role="status" aria-live="polite" hidden>여긴 1층이 아니다</div></div>
<div id="dpad" class="dpad" aria-label="이동"><button class="up" data-dir="up" aria-label="앞으로 이동">↑</button><button class="left" data-dir="left" aria-label="왼쪽으로 이동">←</button><button class="down" data-dir="down" aria-label="뒤로 이동">↓</button><button class="right" data-dir="right" aria-label="오른쪽으로 이동">→</button></div>
<section id="intro" class="intro"><p>아~ 잠깐 바람 쐬러 나갔다 와야지</p><button id="start">엘리베이터를 타자</button></section><section id="ending" class="ending" hidden><p id="resultTime"></p><button id="restart">다시 타기</button></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),c=canvas.getContext('2d'),W=288,H=336;c.imageSmoothingEnabled=false;
const stops=[17,16,15,13,9,7,5,2,1],keys=new Set(),touches=new Map();let time=0,last=0,people=[],queue=[],autoAssigned=false,nextId=0,chatStartedAt=null;
const player={id:'me',x:100,y:182,face:'up',step:0,shirt:'#995e49',pants:'#465b72',hair:'#554236',skin:'#d1ad8b',radius:12};
const doorLog=[];let closeSequence=0;
let S,toastTime=0,warningArmed=true,noticeTime=0,noticeText='',feedbackText='여긴 1층이 아니다';
const lamps={left:{open:0,close:0},right:{open:0,close:0}},selectedFloors=new Set([1]);
const slots={a:[45,94],b:[151,124],c:[64,52],d:[115,55],e:[91,112],f:[132,165],short:[159,60],grandpa:[100,32],runner:[142,56]};
const colors={a:['#546978','#3c4654','#292a2c','#caab8b'],b:['#8a728b','#454653','#514439','#d3b08c'],c:['#637568','#414b56','#292e32','#b18c6b'],d:['#7b8a94','#3c495a','#6b503a','#dbb791'],e:['#9e8b6a','#514e54','#24272b','#c6a382'],f:['#5b7185','#494d57','#4b342c','#cbaa88'],short:['#86725d','#414c57','#443931','#c3a17e'],grandpa:['#807766','#4d5056','#c3c3ba','#b8a18a'],runner:['#526b62','#424954','#42382f','#cfaa83']};
const chatter=[
 ['d','아니 그래서~'],['e','그 건은 말이죠~'],['f','아, 그 얘기였어요?'],
 ['d','내 생각에는~'],['e','그러면 그쪽에서~'],['f','잠깐만, 그게 아니라~'],
 ['d','어제도 말씀드렸는데~'],['e','네, 듣고 있어요~'],['f','일단 들어가면서~'],
 ['d','그러니까 제 말은~'],['f','그건 또 그렇죠~'],['e','아니, 끝까지 들어봐요~'],
 ['d','그 부분은 나중에~'],['e','아까 그 얘기부터~'],['f','그래서 어떻게 됐는데요?'],
 ['d','그게 좀 애매해서~'],['e','맞아요, 근데~'],['f','아, 잠깐만요~']
];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function poly(points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(Math.round(x),Math.round(y)):c.moveTo(Math.round(x),Math.round(y)));c.closePath();c.fill();}
function project(x,y){if(S&&S.scene!=='cabin')return{x:144+(x-100)*.8,y:211+y*.4,scale:1.4};const v=y/200;return{x:144+(x-100)/100*(63+23*v),y:174+v*111,scale:1.28+Math.max(0,v)*.29};}
const glyphs={0:['111','101','101','101','111'],1:['010','110','010','010','111'],2:['111','001','111','100','111'],3:['111','001','111','001','111'],4:['101','101','111','001','001'],5:['111','100','111','001','111'],6:['111','100','111','101','111'],7:['111','001','010','010','010'],8:['111','101','111','101','111'],9:['111','101','111','001','111']};
function number(n,x,y,col,scale=1){for(const[ch,j]of [...String(n)].map((ch,j)=>[ch,j]))glyphs[ch].forEach((row,i)=>[...row].forEach((v,k)=>{if(v==='1')rect(x+(j*4+k)*scale,y+i*scale,scale,scale,col);}));}
function slot(id){return slots[id]||[100,110];}
function actor(id,x=100,y=-28){const col=colors[id],s=slot(id);return{id,x,y,slot:s,shirt:col[0],pants:col[1],hair:col[2],skin:col[3],face:'down',step:0,route:[],role:'entering',speed:id==='grandpa'?8:44,walkClock:0,chat:['d','e','f'].includes(id),grandpa:id==='grandpa',tap:0,tapKind:'',arrived:false,radius:12};}
function waypoint(x,y,action){return{x,y,action};}
function route(a,points,done){a.route=points;a.done=done;}
function enter(a){
 a.role='entering';const s=a.slot,side=['runner','short'].includes(a.id)?'right':'left';a.panelSide=side;
 const px=side==='left'?38:162,points=[waypoint(100,a.chat?-18:-28),waypoint(100,4),waypoint(100,26)];
 // Button users go straight from the doorway to the panel, before their slot.
 if(['a','c','runner','short'].includes(a.id)){
  points.push(waypoint(px,26),waypoint(px,12));
  if(a.id==='runner')points.push(waypoint(px,12,'floor-15'));
  if(a.id==='short')points.push(waypoint(px,12,'floor-5'));
  if(a.id!=='runner')points.push(waypoint(px,12,'close'));
  points.push(waypoint(px,Math.max(33,s[1])));
 }
 points.push(waypoint(s[0],s[1]));route(a,points,()=>{a.role='idle';a.face=a.chat?(a.id==='e'?'right':'left'):'up';a.arrived=true;});
}
function pressPanel(a,kind){if(!a||a.role==='exiting'||a.role==='gone')return;const s=a.slot,side=a.x<100?'left':'right',px=side==='left'?38:162;a.panelSide=side;a.role='panel';a.arrived=false;route(a,[waypoint(px,Math.max(28,a.y)),waypoint(px,12),waypoint(px,12,kind),waypoint(px,s[1]),waypoint(s[0],s[1])],()=>{a.role='idle';a.face='up';a.arrived=true;});}
function exiting(a){if(!a)return;a.role='exiting';a.face='up';const side=['runner','c','e'].includes(a.id)?-20:220;route(a,[waypoint(100,16),waypoint(100,-28),waypoint(side,-28)],()=>{a.role='gone';});}
function incoming(excludeId){return queue.length>0||people.some(a=>a.id!==excludeId&&a.role!=='gone'&&((a.role==='waiting')||(a.role==='entering'&&a.y<18)));}
function doorBlocked(excludeId){return incoming(excludeId)||people.some(a=>a.id!==excludeId&&a.role==='exiting'&&a.y>-12);}
function leaving(){return people.some(a=>a.role==='exiting'&&a.y>-12);}
function makeQueue(ids,delays){ids.forEach((id,i)=>{const chat=['d','e','f'].includes(id),a=actor(id,i===0?100:chat?(i%2?72:128):(i%2?-20:220),chat?-18:-28);a.role='waiting';if(a.chat)a.speed=44;people.push(a);queue.push({id,at:delays?delays[i]:.4+i*.9});});}
function prepareFinalCrowd(){const targets={a:[38,10],b:[162,10],c:[75,8],d:[124,37],e:[75,61],f:[125,85],grandpa:[100,32]};for(const a of people){if(a.role==='gone')continue;const target=targets[a.id]||[100,35];a.role='preexit';route(a,[waypoint(target[0],target[1])],()=>{a.role='idle';a.face='up';});}}
function beginStop(){if(S.initialized)return;S.initialized=true;S.stopClock=0;autoAssigned=false;S.closePermit=null;queue=[];
 switch(S.floor){
 case 17:makeQueue(['a','b']);break;
 case 16:break;
 case 15:exiting(people.find(a=>a.id==='runner'));break;
 case 13:makeQueue(['c']);break;
 case 9:makeQueue(['d','e','f'],[.4,2.2,4]);break;
 case 7:makeQueue(['short']);break;
 case 5:exiting(people.find(a=>a.id==='short'));break;
 case 2:makeQueue(['grandpa']);break;
 case 1:for(const a of people)if(a.role!=='gone')exiting(a);break;
 }
}
