<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#101113;color:#fff;min-height:100%;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffd456;outline-offset:5px}.camera{width:min(100%,490px);padding:12px 0 max(18px,env(safe-area-inset-bottom));transition:width .25s;position:relative}.camera.landscape{width:min(100%,950px,calc((100svh - 190px)*1.333))}.orientation{height:44px;display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:12px}.orientation button{border:0;background:transparent;border-radius:25px;color:#8b8e94;padding:8px 16px;font-size:13px;display:flex;align-items:center;gap:7px}.orientation button[aria-pressed="true"]{background:#27282c;color:#f4d96a}.orientation svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}.viewfinder{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:#78cce3;touch-action:none;cursor:crosshair;isolation:isolate}.landscape .viewfinder{aspect-ratio:4/3}#scene{width:100%;height:100%;display:block}.grid{position:absolute;inset:0;pointer-events:none;opacity:.23;background:linear-gradient(to right,transparent calc(33.333% - .5px),#fff6 33.333%,transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),#fff6 66.666%,transparent calc(66.666% + .5px)),linear-gradient(to bottom,transparent calc(33.333% - .5px),#fff6 33.333%,transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),#fff6 66.666%,transparent calc(66.666% + .5px))}.zoom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#12151869;backdrop-filter:blur(9px);padding:5px;border-radius:30px}.zoom button{border:0;width:39px;height:39px;border-radius:50%;background:#1118;color:#fff;font-size:13px;font-weight:600;padding:0}.zoom button[aria-pressed="true"]{color:#ffdc65;background:#13191dbb;font-size:16px}.zoom button[aria-pressed="true"]::after{content:'×';font-size:10px;margin-left:1px}.controls{height:108px;display:flex;align-items:center;justify-content:center;position:relative}#shutter{height:78px;width:78px;border:3px solid #fff;border-radius:50%;background:transparent;padding:4px;position:relative}#shutter::after{content:'';display:block;border-radius:50%;height:100%;width:100%;background:#fff;transition:transform .1s}#shutter:active::after{transform:scale(.89)}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}.flash.fire{animation:flash .24s ease-out}@keyframes flash{0%{opacity:.95}100%{opacity:0}}#focus-box{position:absolute;width:64px;height:64px;pointer-events:none;border:1.5px solid #ffe56b;transform:translate(-50%,-50%) scale(1);opacity:0;z-index:3;transition:opacity .25s,transform .2s}#focus-box::before,#focus-box::after{content:'';position:absolute;background:#ffe56b}#focus-box::before{width:8px;height:1px;left:calc(50% - 4px);top:50%}#focus-box::after{height:8px;width:1px;top:calc(50% - 4px);left:50%}#focus-box.active{opacity:1;transform:translate(-50%,-50%) scale(.85)}.review{position:fixed;inset:0;z-index:20;background:#101113;display:flex;align-items:center;justify-content:center;padding:22px;cursor:pointer}.review[hidden]{display:none}.print{display:flex;flex-direction:column;align-items:center;gap:0;max-width:94vw;max-height:94svh;background:none;padding:0;box-shadow:none;transform:none}.print img{display:block;max-width:94vw;max-height:calc(78svh - 110px);object-fit:contain}

[hidden]{display:none!important}.intro,.ending{min-height:100svh;width:100%;background:#faf5e8;color:#34324e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 22px;text-align:center}.intro h1{font-size:clamp(24px,5vw,34px);line-height:1.5;letter-spacing:-1.3px;margin:28px 0}.friend-card{width:200px;height:245px;background:#bae7db;border:0;box-shadow:none;transform:none;position:relative;border-radius:4px}.friend-card canvas{width:100%;height:100%;object-fit:contain}.card-tape{position:absolute;left:calc(50% - 39px);top:-20px;width:78px;height:27px;background:#f5cc70ba;transform:rotate(8deg)}.intro button,.ending button{border:0;border-bottom:5px solid #cc5e25;border-radius:17px;background:#ff833d;color:#fff;padding:16px 42px;font-size:19px;font-weight:800;letter-spacing:-.4px}.intro button:active,.ending button:active{transform:translateY(3px);border-bottom-width:2px}#photo-caption{font-size:14px;font-weight:700;color:#fff;margin:18px 0 1px;line-height:1.65;text-align:center;white-space:pre-line}.eyebrow{letter-spacing:3px;font-size:11px;color:#9e987f}.ending h1{font-size:clamp(24px,5vw,35px);letter-spacing:-1.5px}.album{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;width:min(850px,100%);margin:20px 0 35px}.album figure{margin:0;width:145px;background:none;padding:0;box-shadow:none;transform:none}.album img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.album figcaption{font-size:12px;font-weight:bold;margin-top:8px}.album img{cursor:pointer}@media(max-width:450px){.album{gap:12px}.album figure{width:calc(50% - 10px)}}
#next-photo{display:block;margin:14px auto 0;border:0;border-bottom:4px solid #cc5e25;border-radius:12px;background:#ff833d;color:white;padding:12px 26px;font-size:16px;font-weight:800}#next-photo:active{transform:translateY(2px);border-bottom-width:2px}.review{cursor:default}

<body>
<section class="intro" id="intro">
 <div class="friend-card"><canvas id="friend-preview" width="240" height="330" aria-label="주황색 옷에 초록 가방을 멘 친구"></canvas></div>
 <h1 style="margin-bottom:8px">나 여기서 사진 한 장만 찍어주라</h1>
 <p style="margin:0 0 28px;font-size:18px;line-height:1.5">친구의 사진을 찍어주세요!</p>
 <button id="start-game">게임 시작</button>
</section>
<main hidden class="camera" id="camera" aria-label="친구 좀 찍자 카메라">
 <div class="orientation" role="group" aria-label="사진 방향">
  <button data-orient="portrait" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="2" width="10" height="16" rx="2"/></svg>세로</button>
  <button data-orient="landscape" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="5" width="16" height="10" rx="2"/></svg>가로</button>
 </div>
 <div class="viewfinder" id="viewfinder" aria-label="관광객 사이에서 카메라를 보는 주황색 옷의 친구. 화면을 눌러 초점을 맞추세요.">
  <canvas id="scene" tabindex="0" aria-label="화면을 누르거나 키보드 F를 눌러 초점 맞추기"></canvas><div class="grid" aria-hidden="true"></div><div id="focus-box" aria-hidden="true"></div><div class="flash" aria-hidden="true"></div>
  <div class="zoom" role="group" aria-label="줌 배율"><button data-zoom="0.5" aria-pressed="false">0.5</button><button data-zoom="1" aria-pressed="true">1</button><button data-zoom="2" aria-pressed="false">2</button></div>
 </div>
 <div class="controls"><button id="shutter" aria-label="사진 촬영. 스페이스 키로도 촬영할 수 있습니다."></button></div>
</main>
<div class="review" id="review" role="dialog" aria-label="촬영한 사진. 다음 사진 찍기를 눌러 계속하기" aria-modal="true" tabindex="-1" hidden><div class="print"><img id="photo" alt="촬영한 친구와 관광지 사진"><p id="photo-caption" aria-live="polite"></p><button id="next-photo">다음 사진 찍기</button></div></div>
<section id="ending" class="ending" hidden><h1>친구와 좋은 추억이 생겼어요!</h1><div id="album" class="album"></div><button id="restart-game">다시 하기</button></section>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#scene'),ctx=canvas.getContext('2d'),view=$('#viewfinder'),focusBox=$('#focus-box'),camera=$('#camera'),review=$('#review');
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(rand(0,a.length))],clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const palette=['#7b6bc8','#e85e87','#209aab','#5684d6','#d4b94b','#6b94a3','#a95a90','#969bdd'];const skins=['#f3c49b','#e5a773','#bd7956','#88543f','#f6d7ad'];const hairs=['#6c432b','#bb7542','#ecc96e','#8e939a','#292e38'];const hairStyles=['short','bob','parted','bald','ponytail'];
const stages=['피사의 사탑','에펠탑','오페라 하우스','빅벤','자유의 여신상'];let stage=0,started=false,completed=false,shotResult=null,fastExposure=false;const album=[];
let W=450,H=600,dpr=1,t=0,last=0,zoom=1,zoomGoal=1,focus=2.65,focusGoal=2.65,focusLock=0,nextCross=2.3,nextFast=6,nextGroup=5,nextResident=9,nextVendor=13,lastAuto=-10,photoURL='',photoFocusTimer=0,paused=true;
// All stages retain the first stage's baseline. New obstacles accumulate.
const stageRules=[
 {far:30,mid:6,kids:0,speed:1,cross:[5.4,8],fast:0,group:0},
 {far:42,mid:9,kids:5,speed:1.35,cross:[4.1,6.2],fast:0,group:0},
 {far:52,mid:11,kids:8,speed:1.55,cross:[3.8,5.6],fast:1,group:0},
 {far:62,mid:13,kids:10,speed:1.7,cross:[3.6,5.2],fast:1,group:8},
 {far:72,mid:16,kids:12,speed:1.85,cross:[3.3,4.9],fast:1,group:12}
];
const people=[],hitboxes=[];const friend={id:'friend',x:0,depth:2.65,color:'#ff833d',skin:'#efb78b',hair:'#44334b',friend:true,style:0,phase:0};
function makePerson(depth,x,near=false){
 const role=pick(['camera','map','selfie','suitcase','backpack','pose','phone','icecream']);
 return{id:Math.random(),x,depth,color:pick(palette),skin:pick(skins),hair:pick(hairs),hairStyle:pick(hairStyles),role,style:role==='camera'?2:role==='pose'?3:role==='suitcase'?1:0,phase:rand(0,7),speed:rand(.025,.065)*(Math.random()<.5?-1:1)*(near?2.5:1)*stageRules[stage].speed,near,hat:Math.random()<.55,glasses:Math.random()<.23};
}
function assignCrowdPaces(){
 // Keep the same population, but mix fast walkers with normal walkers.
 // Tourists holding a landmark pose remain deliberately slow.
 const walkers=people.filter(p=>!['pisaPose','eiffelPose'].includes(p.role));
 for(let i=walkers.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[walkers[i],walkers[j]]=[walkers[j],walkers[i]];}
 for(const [i,p]of walkers.entries()){p.hurrying=i<Math.floor(walkers.length/2);p.paceFactor=p.hurrying?rand(2.8,4.2):1;p.speed*=p.paceFactor;}
}
function resetStage(){
 people.length=0;sprites.clear();t=0;last=0;nextCross=4.5;nextFast=rand(1.5,3);nextGroup=rand(4,6);nextResident=rand(7,10);nextVendor=rand(10,14);lastAuto=-10;fastExposure=false;focus=focusGoal=friend.depth;focusLock=0;zoom=zoomGoal=1;backdropKey='';
 document.querySelectorAll('[data-zoom]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.zoom==='1')));
 friend.x=stage===2?-.23:0;
 const rule=stageRules[stage];
 // Added crowds mainly fill the friend's depth and nearer lateral lanes,
 // rather than stacking a wall of people behind the landmark.
 for(let i=0;i<rule.far;i++){const back=i%3===0;people.push(makePerson(back?rand(3.1,4.8):rand(1.9,3.1),back?rand(-.95,.95):rand(.28,1.65)*(Math.random()<.5?-1:1)));}

 for(let i=0;i<rule.mid;i++)people.push(makePerson(rand(2.2,3.0),rand(.32,1.3)*(Math.random()<.5?-1:1)));
 for(let i=0;i<rule.kids;i++){const child=makePerson(rand(1.8,3.4),rand(-1.2,1.2));child.kid=true;child.size=rand(.56,.69);child.speed*=1.35;child.style=0;child.role=pick(['backpack','icecream','phone']);people.push(child);}

 if(stage<2){for(let i=0;i<Math.min(stage===0?4:3,people.length);i++){const p=people[i*3];p.role=stage===0?'pisaPose':'eiffelPose';p.style=0;p.depth=rand(2.3,3.0);p.x=(i%2?-1:1)*rand(.34,.58);p.poseRight=p.x<0;p.speed*=.35;}}
 assignCrowdPaces();
 view.setAttribute('aria-label' ,stages[stage]+' 앞의 친구를 찍어주세요. 화면을 눌러 초점을 맞출 수 있습니다.');
}
function rr(c,x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}
function ellipse(c,x,y,rx,ry,fill){c.fillStyle=fill;c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);c.fill();}
function line(c,points,color,width){c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
const nativeFilter='filter' in ctx,softCanvas=document.createElement('canvas');
function drawSoft(image,x,y,w,h,blur){
 if(nativeFilter){ctx.filter=blur>.4?`blur(${blur.toFixed(2)}px)`:'none';ctx.drawImage(image,x,y,w,h);ctx.filter='none';return;}
 // Canvas filter is missing in some mobile browsers. Downsample then interpolate
 // so focus still changes without CSS filters, libraries or network resources.
 if(blur<.8){ctx.drawImage(image,x,y,w,h);return;}
 const scale=1/Math.max(1,blur*1.3);softCanvas.width=Math.max(2,Math.round(w*scale));softCanvas.height=Math.max(2,Math.round(h*scale));const sc=softCanvas.getContext('2d');sc.imageSmoothingEnabled=true;sc.drawImage(image,0,0,softCanvas.width,softCanvas.height);ctx.imageSmoothingEnabled=true;ctx.drawImage(softCanvas,x,y,w,h);
}
// A human owns exactly two arms. The same hand coordinates anchor its single
// held item; gait/style/foreground flags never add another prop or hand.
function characterPose(p,walk=0){
 const left=[[84,180],[62+walk*9,211],[64+walk*12,243]],right=[[156,180],[177-walk*9,211],[175-walk*12,243]];
 let item='none',arms=[left,right],fingers=null;
 if(p.friend){arms=[[[85,180],[61,205],[57,233]],[[155,180],[177,151],[174,120]]];fingers='peace';}
 else if(p.guide||p.role==='guide'){item='flag';arms=[left,[[156,180],[179,183],[192,164]]];}
 else if(p.walker){item='leash';}
 else switch(p.role){
  case 'map':item='map';arms=[[[84,180],[59,202],[72,214]],[[156,180],[181,202],[174,214]]];break;
  case 'camera':item='camera';arms=[[[84,180],[59,157],[82,131]],[[156,180],[183,157],[166,131]]];break;
  case 'selfie':item='selfie';arms=[left,[[156,180],[177,151],[188,116]]];break;
  case 'suitcase':item='suitcase';arms=[left,[[156,180],[181,205],[190,231]]];break;
  case 'phone':item='phone';arms=[left,[[156,180],[182,207],[172,231]]];break;
  case 'icecream':item='icecream';arms=[left,[[156,180],[176,151],[187,123]]];break;
  case 'vendor':item='tray';arms=[[[84,180],[53,192],[51,211]],[[156,180],[193,192],[195,211]]];break;
  case 'pisaPose':arms=[[[87,180],[52,159],[25,145]],[[153,180],[99,138],[30,121]]];fingers='push';break;
  case 'eiffelPose':arms=[[[84,180],[60,147],[61,78]],right];fingers='pinch';break;
  case 'pose':arms=[[[84,180],[54,145],[38,108]],[[156,180],[183,145],[200,108]]];fingers='doublePeace';break;
 }
 return{item,arms,fingers};
}
function drawCharacterArms(c,p,pose){for(const points of pose.arms)line(c,points,p.friend?'#ff833d':p.color,25);}
function drawCharacterHands(c,p,pose){
 const skin=p.skin;for(const [i,points]of pose.arms.entries()){if(pose.item==='phone'&&i===1)continue;const [x,y]=points[2];ellipse(c,x,y,11,13,skin);}
 // The phone palm is behind the handset. Only small fingertips wrap its bezel.
 if(pose.item==='phone'){const[x,y]=pose.arms[1][2];for(const dy of[-6,0,6])line(c,[[x-13,y+dy],[x-10,y+dy]],skin,3);line(c,[[x+12,y-2],[x+12,y+5]],skin,3);}
 if(pose.fingers==='peace'||pose.fingers==='doublePeace'){
  const indices=pose.fingers==='doublePeace'?[0,1]:[1];for(const i of indices){const[x,y]=pose.arms[i][2];line(c,[[x-4,y-6],[x-11,y-25]],skin,7);line(c,[[x+3,y-7],[x+10,y-25]],skin,7);}
 }else if(pose.fingers==='pinch'){const[x,y]=pose.arms[0][2];line(c,[[x-5,y-5],[x-3,y-20],[x+10,y-21]],skin,6);line(c,[[x+4,y+3],[x+15,y-5]],skin,6);}
}
function drawCharacterEquipment(c,p,pose){
 const L=pose.arms[0][2],R=pose.arms[1][2];
 switch(pose.item){
 case 'map':{
  const x=L[0],y=L[1]-33,w=R[0]-L[0];rr(c,x,y,w,66,4,'#fff5d2');c.fillStyle='#cae7bd';c.beginPath();c.moveTo(x+4,y+13);c.lineTo(x+24,y+3);c.lineTo(x+39,y+32);c.lineTo(x+69,y+16);c.lineTo(x+w-4,y+47);c.lineTo(x+w-20,y+63);c.lineTo(x+4,y+56);c.fill();line(c,[[x+9,y+30],[x+29,y+37],[x+54,y+14],[x+74,y+39],[x+w-8,y+34]],'#75b7cf',6);line(c,[[x+w/3,y+2],[x+w/3,y+64]],'#dfcea5',2);line(c,[[x+w*2/3,y+2],[x+w*2/3,y+64]],'#dfcea5',2);ellipse(c,x+74,y+39,5,5,'#f17c69');break;}
 case 'camera':{
  const x=L[0],y=L[1]-26,w=R[0]-L[0];line(c,[[x+12,y+40],[120,179],[x+w-13,y+40]],'#414a5e',3);rr(c,x,y,w,45,10,'#39475b');rr(c,x+12,y-8,25,11,4,'#39475b');ellipse(c,x+w*.57,y+23,18,18,'#17263a');ellipse(c,x+w*.57,y+23,12,12,'#72c7da');ellipse(c,x+w*.57+4,y+19,5,5,'#d5f7ff');rr(c,x+7,y+7,16,9,3,'#efce67');break;}
 case 'selfie':{
  const tip=[R[0]+32,R[1]-64];line(c,[R,tip],'#5b6673',5);rr(c,tip[0]-16,tip[1]-48,32,48,6,'#343e56');rr(c,tip[0]-11,tip[1]-43,22,35,3,'#b4e1e1');ellipse(c,tip[0],tip[1]-6,2,2,'#586f82');break;}
 case 'suitcase':{
  const x=R[0]-13,y=251;line(c,[[R[0],y],[R[0],R[1]],[R[0]+22,R[1]],[R[0]+22,y]],'#586176',4);rr(c,x,y,52,53,10,'#f2c35f');for(const dx of[8,23,39])rr(c,x+dx,y+6,4,39,2,'#e3ad43');ellipse(c,x+8,306,5,5,'#37465b');ellipse(c,x+44,306,5,5,'#37465b');rr(c,x+13,y+14,18,13,3,'#fff5d3');break;}
 case 'phone':rr(c,R[0]-12,R[1]-21,27,43,5,'#3b415d');rr(c,R[0]-7,R[1]-16,17,30,3,'#b2e1e8');break;
 case 'icecream':{
  const[x,y]=R;c.fillStyle='#d6a262';c.beginPath();c.moveTo(x-12,y-17);c.lineTo(x+12,y-17);c.lineTo(x,y+13);c.closePath();c.fill();ellipse(c,x,y-24,15,16,'#f8dbe6');ellipse(c,x-3,y-38,13,13,'#a2d3a7');ellipse(c,x,y-50,10,10,'#fff2b4');break;}
 case 'tray':{
  // Region-neutral bracelets and colorful fridge magnets only.

document.addEventListener('keydown',e=>{if(!started||completed)return;if(e.code==='Escape'&&!review.hidden){e.preventDefault();closeReview();}else if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(review.hidden)shoot();else closeReview();}else if(e.code==='KeyF'&&review.hidden&&!paused){const v=personRect(friend);refocus(v.x,v.top+v.h*.33);}});
document.addEventListener('visibilitychange',()=>{last=0;});
})();
</script>
